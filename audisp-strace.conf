# /etc/audit/plugins.d/audisp-strace.conf
#
# Audisp plugin configuration for audisp-strace.
# This configuration dispatches audit events live to audisp-strace.
#
# Set 'active = yes' to enable this plugin.
# Reload or restart auditd after making changes:
#     systemctl restart auditd   (or 'service auditd reload')

active = no
direction = out
path = /usr/local/bin/audisp-strace
type = always
args = --live -o /var/log/audit/audisp-strace.log
format = string
